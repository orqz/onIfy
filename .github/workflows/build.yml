name: Build

on:
    push:
        branches: [main, dev]
        tags: ["v*"]
    pull_request:
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

# onify needs GTK 4.20 and libadwaita 1.8, newer than Ubuntu ships: Linux
# builds the Flatpak on the GNOME 51 runtime, Windows and macOS against
# MSYS2's and Homebrew's GTK.
#
# Each job packages onify the way people install it (Flatpak, installer,
# .app). Windows and macOS then smoke-test the package: it must still be
# running 20 s after launch, on a machine without that GTK installed where
# possible. A screenshot of that run is uploaded next to the package. Uploads expire
# after a week and may fail without failing the build: private repos share
# a small storage quota.
#
# Linux and Windows build for both x86_64 and ARM (GitHub's ARM runners);
# the Mac build is Apple Silicon.
#
# Releases: push an annotated tag whose message is the changelog
# (git tag -a vX.Y.Z --cleanup=verbatim -F notes.md). Each job attaches its
# package to a draft release with those notes (release files don't count
# against that quota), and it's published once all of them have passed.
#
# Windows code signing (SignPath) switches on once the repository has the
# SIGNPATH_ORGANIZATION_ID variable and SIGNPATH_API_TOKEN secret; releases
# are then signed, so SmartScreen and Defender stop flagging the installer.
jobs:
    flatpak:
        name: Linux (Flatpak, ${{ matrix.arch }})
        permissions:
            contents: write
        strategy:
            fail-fast: false
            matrix:
                include:
                    - arch: x86_64
                      runner: ubuntu-latest
                    - arch: aarch64
                      runner: ubuntu-24.04-arm
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 60
        container:
            image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
            options: --privileged
        steps:
            - uses: actions/checkout@v5

            - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
              with:
                  manifest-path: packaging/flatpak/io.github.orqz.onIfy.yml
                  bundle: onify-${{ matrix.arch }}.flatpak
                  arch: ${{ matrix.arch }}
                  cache-key: flatpak-builder-${{ matrix.arch }}-${{ hashFiles('Cargo.lock') }}
                  upload-artifact: false

            - uses: actions/upload-artifact@v4
              continue-on-error: true
              with:
                  name: onify-linux-${{ matrix.arch }}-flatpak
                  path: onify-${{ matrix.arch }}.flatpak
                  retention-days: 7

            - name: Attach to the release
              if: startsWith(github.ref, 'refs/tags/v')
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  command -v gh >/dev/null || dnf install -y gh
                  notes=$(mktemp)
                  tag=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq .object.sha)
                  gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag" --jq .message > "$notes" || true
                  gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
                      gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft \
                          --title "${GITHUB_REF_NAME#v}" --notes-file "$notes" || true
                  gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber onify-${{ matrix.arch }}.flatpak

    windows:
        name: Windows (${{ matrix.arch }})
        permissions:
            contents: write
        strategy:
            fail-fast: false
            matrix:
                include:
                    - arch: x86_64
                      runner: windows-latest
                      msystem: UCRT64
                      compiler: gcc:p
                    - arch: arm64
                      runner: windows-11-arm
                      msystem: CLANGARM64
                      compiler: clang:p
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 60
        defaults:
            run:
                shell: msys2 {0}
        steps:
            - uses: msys2/setup-msys2@v2
              with:
                  msystem: ${{ matrix.msystem }}
                  update: true
                  install: git
                  pacboy: >-
                      rust:p
                      ${{ matrix.compiler }}
                      pkgconf:p
                      gtk4:p
                      libadwaita:p
                      librsvg:p
                      adwaita-icon-theme:p

            - uses: actions/checkout@v5

            - run: cargo build --release --locked

            - name: Bundle GTK
              run: packaging/windows/bundle.sh

            - name: Build installer
              shell: pwsh
              run: |
                  $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
                  if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
                  $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
                  # a.b.c+d in Cargo.toml is release a.b.c.d (see build.rs)
                  $version = if ($version -match '\+') { $version -replace '\+', '.' } else { "$version.0" }
                  & $iscc "/DAppVersion=$version" "/DArch=${{ matrix.arch }}" packaging\windows\onify.iss
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            # Signing (see the top): the installer goes to SignPath and comes
            # back signed, replacing the unsigned one.
            - name: Upload the installer for signing
              id: unsigned
              if: startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ORGANIZATION_ID != ''
              uses: actions/upload-artifact@v4
              with:
                  name: unsigned-${{ matrix.arch }}
                  path: dist/onify-setup-${{ matrix.arch }}.exe
                  retention-days: 1

            - name: Sign the installer
              if: startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ORGANIZATION_ID != ''
              uses: signpath/github-action-submit-signing-request@v1
              with:
                  api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
                  organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
                  project-slug: onify
                  signing-policy-slug: release-signing
                  github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
                  wait-for-completion: true
                  output-artifact-directory: dist/signed

            - name: Use the signed installer
              if: startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ORGANIZATION_ID != ''
              shell: bash
              run: mv -f dist/signed/onify-setup-${{ matrix.arch }}.exe dist/

            # Plain PowerShell has no MSYS2 on its PATH, so a missing DLL in
            # the bundle fails here instead of being found in MSYS2. A second
            # run draws text through FreeType (PANGOCAIRO_BACKEND=fc) instead
            # of DirectWrite, to compare how sharp each looks.
            - name: Smoke test
              shell: pwsh
              run: |
                  Add-Type -AssemblyName System.Windows.Forms, System.Drawing
                  function Shoot($file) {
                      $screen = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
                      $shot = New-Object System.Drawing.Bitmap $screen.Width, $screen.Height
                      [System.Drawing.Graphics]::FromImage($shot).CopyFromScreen($screen.Location, [System.Drawing.Point]::Empty, $screen.Size)
                      $shot.Save("$PWD\dist\$file")
                  }
                  $app = Start-Process -FilePath dist\onify\bin\onify.exe -PassThru
                  Start-Sleep -Seconds 20
                  Shoot "screenshot-windows-${{ matrix.arch }}.png"
                  if ($app.HasExited) { Write-Error "onify quit on its own (exit code $($app.ExitCode))"; exit 1 }
                  Stop-Process -Id $app.Id
                  Start-Sleep -Seconds 2
                  $env:PANGOCAIRO_BACKEND = "fc"
                  $fc = Start-Process -FilePath dist\onify\bin\onify.exe -PassThru
                  Start-Sleep -Seconds 25
                  Shoot "screenshot-windows-${{ matrix.arch }}-freetype.png"
                  if (-not $fc.HasExited) { Stop-Process -Id $fc.Id }

            - name: Attach to the release
              if: startsWith(github.ref, 'refs/tags/v')
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  notes=$(mktemp)
                  tag=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq .object.sha)
                  gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag" --jq .message > "$notes" || true
                  gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
                      gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft \
                          --title "${GITHUB_REF_NAME#v}" --notes-file "$notes" || true
                  gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber dist/onify-setup-${{ matrix.arch }}.exe

            - uses: actions/upload-artifact@v4
              continue-on-error: true
              with:
                  name: onify-windows-${{ matrix.arch }}-setup
                  path: dist/onify-setup-${{ matrix.arch }}.exe
                  retention-days: 7

            - uses: actions/upload-artifact@v4
              continue-on-error: true
              if: always()
              with:
                  name: screenshot-windows-${{ matrix.arch }}
                  path: dist/screenshot-windows-*.png
                  if-no-files-found: ignore
                  retention-days: 3

    macos:
        name: macOS
        permissions:
            contents: write
        runs-on: macos-latest # Apple Silicon
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@v5

            - name: Install GTK
              run: brew install gtk4 libadwaita pkgconf librsvg adwaita-icon-theme dylibbundler

            - uses: Swatinem/rust-cache@v2

            - run: cargo build --release --locked

            - name: Bundle onify.app
              run: packaging/macos/bundle.sh

            # bundle.sh already fails if anything still links into Homebrew.
            - name: Smoke test
              run: |
                  dist/onify.app/Contents/MacOS/onify &
                  pid=$!
                  sleep 20
                  screencapture -x dist/screenshot-macos.png || true
                  kill -0 $pid || { echo "onify quit on its own"; exit 1; }
                  kill $pid

            - name: Attach to the release
              if: startsWith(github.ref, 'refs/tags/v')
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  notes=$(mktemp)
                  tag=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq .object.sha)
                  gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag" --jq .message > "$notes" || true
                  gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
                      gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft \
                          --title "${GITHUB_REF_NAME#v}" --notes-file "$notes" || true
                  gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber dist/onify-macos-arm64.dmg

            - uses: actions/upload-artifact@v4
              continue-on-error: true
              with:
                  name: onify-macos-arm64
                  path: dist/onify-macos-arm64.dmg
                  retention-days: 7

            - uses: actions/upload-artifact@v4
              continue-on-error: true
              if: always()
              with:
                  name: screenshot-macos
                  path: dist/screenshot-macos.png
                  if-no-files-found: ignore
                  retention-days: 3

    publish:
        name: Publish release
        needs: [flatpak, windows, macos]
        if: startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Publish the draft
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest

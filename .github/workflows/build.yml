name: Build

on:
    push:
        branches: [main, dev]
        tags: ["v*"]
    pull_request:
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

# onIfy needs GTK 4.20 and libadwaita 1.8, newer than Ubuntu ships: Linux
# builds the Flatpak on the GNOME 49 runtime, Windows and macOS against
# MSYS2's and Homebrew's GTK.
#
# Each job packages onIfy the way people install it (Flatpak, installer,
# .app). Windows and macOS then smoke-test the package: it must still be
# running 20 s after launch, on a machine without that GTK installed where
# possible. A screenshot of that run is uploaded next to the package. Uploads expire
# after a week and may fail without failing the build: private repos share
# a small storage quota.
#
# Releases: push an annotated tag whose message is the changelog
# (git tag -a vX.Y.Z --cleanup=verbatim -F notes.md). Each job attaches its
# package to a draft release with those notes (release files don't count
# against that quota), and it's published once all three have passed.
jobs:
    flatpak:
        name: Linux (Flatpak)
        permissions:
            contents: write
        runs-on: ubuntu-latest
        timeout-minutes: 60
        container:
            image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-49
            options: --privileged
        steps:
            - uses: actions/checkout@v5

            - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
              with:
                  manifest-path: packaging/flatpak/io.github.orqz.onIfy.yml
                  bundle: onIfy-x86_64.flatpak
                  cache-key: flatpak-builder-${{ hashFiles('Cargo.lock') }}
                  upload-artifact: false

            - name: Attach to the release
              if: startsWith(github.ref, 'refs/tags/v')
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  command -v gh >/dev/null || dnf install -y gh
                  notes=$(mktemp)
                  tag=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq .object.sha)
                  gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag" --jq .message > "$notes" || true
                  gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
                      gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft \
                          --title "${GITHUB_REF_NAME#v}" --notes-file "$notes" || true
                  gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber onIfy-x86_64.flatpak

    windows:
        name: Windows
        permissions:
            contents: write
        runs-on: windows-latest
        timeout-minutes: 60
        defaults:
            run:
                shell: msys2 {0}
        steps:
            - uses: msys2/setup-msys2@v2
              with:
                  msystem: UCRT64
                  update: true
                  install: git
                  pacboy: >-
                      rust:p
                      gcc:p
                      pkgconf:p
                      gtk4:p
                      libadwaita:p
                      librsvg:p
                      adwaita-icon-theme:p

            - uses: actions/checkout@v5

            - run: cargo build --release --locked

            - name: Bundle GTK
              run: packaging/windows/bundle.sh

            - name: Build installer
              shell: pwsh
              run: |
                  $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
                  if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
                  $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
                  # a.b.c+d in Cargo.toml is release a.b.c.d (see build.rs)
                  $version = if ($version -match '\+') { $version -replace '\+', '.' } else { "$version.0" }
                  & $iscc "/DAppVersion=$version" packaging\windows\onIfy.iss
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            # Plain PowerShell has no MSYS2 on its PATH, so a missing DLL in
            # the bundle fails here instead of being found in MSYS2.
            - name: Smoke test
              shell: pwsh
              run: |
                  $app = Start-Process -FilePath dist\onIfy\bin\onify.exe -PassThru
                  Start-Sleep -Seconds 20
                  Add-Type -AssemblyName System.Windows.Forms, System.Drawing
                  $screen = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
                  $shot = New-Object System.Drawing.Bitmap $screen.Width, $screen.Height
                  [System.Drawing.Graphics]::FromImage($shot).CopyFromScreen($screen.Location, [System.Drawing.Point]::Empty, $screen.Size)
                  $shot.Save("$PWD\dist\screenshot-windows.png")
                  if ($app.HasExited) { Write-Error "onIfy quit on its own (exit code $($app.ExitCode))"; exit 1 }
                  Stop-Process -Id $app.Id

            - name: Attach to the release
              if: startsWith(github.ref, 'refs/tags/v')
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  notes=$(mktemp)
                  tag=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq .object.sha)
                  gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag" --jq .message > "$notes" || true
                  gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
                      gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft \
                          --title "${GITHUB_REF_NAME#v}" --notes-file "$notes" || true
                  gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber dist/onIfy-setup-x86_64.exe

            - uses: actions/upload-artifact@v4
              continue-on-error: true
              with:
                  name: onIfy-windows-x86_64-setup
                  path: dist/onIfy-setup-x86_64.exe
                  retention-days: 7

            - uses: actions/upload-artifact@v4
              continue-on-error: true
              if: always()
              with:
                  name: screenshot-windows
                  path: dist/screenshot-windows.png
                  if-no-files-found: ignore
                  retention-days: 3

    macos:
        name: macOS
        permissions:
            contents: write
        runs-on: macos-latest # Apple Silicon
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@v5

            - name: Install GTK
              run: brew install gtk4 libadwaita pkgconf librsvg adwaita-icon-theme dylibbundler

            - uses: Swatinem/rust-cache@v2

            - run: cargo build --release --locked

            - name: Bundle onIfy.app
              run: packaging/macos/bundle.sh

            # bundle.sh already fails if anything still links into Homebrew.
            - name: Smoke test
              run: |
                  dist/onIfy.app/Contents/MacOS/onify &
                  pid=$!
                  sleep 20
                  screencapture -x dist/screenshot-macos.png || true
                  kill -0 $pid || { echo "onIfy quit on its own"; exit 1; }
                  kill $pid

            - name: Attach to the release
              if: startsWith(github.ref, 'refs/tags/v')
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  notes=$(mktemp)
                  tag=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq .object.sha)
                  gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag" --jq .message > "$notes" || true
                  gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
                      gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft \
                          --title "${GITHUB_REF_NAME#v}" --notes-file "$notes" || true
                  gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber dist/onIfy-macos-arm64.dmg

            - uses: actions/upload-artifact@v4
              continue-on-error: true
              with:
                  name: onIfy-macos-arm64
                  path: dist/onIfy-macos-arm64.dmg
                  retention-days: 7

            - uses: actions/upload-artifact@v4
              continue-on-error: true
              if: always()
              with:
                  name: screenshot-macos
                  path: dist/screenshot-macos.png
                  if-no-files-found: ignore
                  retention-days: 3

    publish:
        name: Publish release
        needs: [flatpak, windows, macos]
        if: startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Publish the draft
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
